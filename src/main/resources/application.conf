config {
    # The Postgres connection is declared as a single env var (E9S_MARKET_DATABASE_URL) + MARKET_SCHEMA,
    # parsed by JdbcConfigLoader — no HOCON database block anymore.

    kafka {
        ingestion {
            #server = "exemplarius.dev.machine"
            server = "localhost"
            port = 29092
        }
        topic {
            trade_event = "e9s.bitmex.trade.event"
            trade_aggregate_event = "e9s.bitmex.trade_aggregate.event"
            trade_aggregate_batch = "e9s.bitmex.trade_aggregate.batch"
        }
    }
}